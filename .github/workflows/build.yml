name: Build Mod

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate project directory
        id: locate
        run: |
          BUILD_FILE=$(find . -maxdepth 3 -name "build.gradle" | head -n 1)
          if [ -z "$BUILD_FILE" ]; then
            echo "::error::Не найден build.gradle! Убедитесь, что файлы проекта загружены в репозиторий."
            exit 1
          fi
          PROJECT_DIR=$(dirname "$BUILD_FILE")
          echo "Project found in: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> $GITHUB_OUTPUT

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Generate Gradle Wrapper
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: |
          if [ ! -f "gradlew" ]; then
            echo "Generating Gradle 8.10.2 wrapper..."
            gradle wrapper --gradle-version 8.10.2
          fi
          chmod +x gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: ./gradlew build --no-daemon

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DropAll-mod
          path: ${{ steps.locate.outputs.project_dir }}/build/libs/*.jar
